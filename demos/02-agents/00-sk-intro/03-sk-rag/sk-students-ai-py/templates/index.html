<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student AI Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1rem;
            background-color: #f8f9fa;
        }
        .question {
            background-color: #007bff;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            margin: 0.5rem 0;
            max-width: 80%;
            margin-left: auto;
            text-align: right;
        }
        .answer {
            background-color: white;
            color: #333;
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            margin: 0.5rem 0;
            max-width: 80%;
            border: 1px solid #dee2e6;
        }
        .loading {
            text-align: center;
            color: #6c757d;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="text-center mb-4">Student AI Assistant</h1>
                <p class="text-center text-muted">Ask me anything about your studies!</p>
                
                <div class="card">
                    <div class="card-header">
                        <div class="row">
                            <div class="col-md-6">
                                <label for="studentName" class="form-label">Your Name:</label>
                                <input type="text" class="form-control" id="studentName" placeholder="Enter your name" value="Student">
                            </div>
                            <div class="col-md-6 d-flex align-items-end">
                                <button class="btn btn-secondary" onclick="loadHistory()">Load History</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="chatContainer" class="chat-container mb-3">
                            <div class="answer">
                                <strong>AI Assistant:</strong> Hello! I'm here to help you with your questions. What would you like to know?
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <input type="text" class="form-control" id="questionInput" 
                                   placeholder="Type your question here..." 
                                   onkeypress="handleKeyPress(event)">
                            <button class="btn btn-primary" onclick="askQuestion()">Ask</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                askQuestion();
            }
        }

        async function askQuestion() {
            const questionInput = document.getElementById('questionInput');
            const studentName = document.getElementById('studentName').value.trim();
            const question = questionInput.value.trim();
            
            if (!question) {
                alert('Please enter a question.');
                return;
            }
            
            if (!studentName) {
                alert('Please enter your name.');
                return;
            }

            // Add question to chat
            addMessageToChat('question', question);
            
            // Show loading
            const loadingDiv = addMessageToChat('answer', '<div class="loading">AI is thinking...</div>');
            
            // Clear input
            questionInput.value = '';
            
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question,
                        student_name: studentName
                    })
                });
                
                const data = await response.json();
                
                // Remove loading message
                loadingDiv.remove();
                
                if (data.error) {
                    addMessageToChat('answer', `<strong>Error:</strong> ${data.error}`);
                } else {
                    addMessageToChat('answer', `<strong>AI Assistant:</strong> ${data.answer}`);
                }
            } catch (error) {
                loadingDiv.remove();
                addMessageToChat('answer', `<strong>Error:</strong> Failed to get response from AI.`);
            }
        }

        function addMessageToChat(type, content) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = type;
            messageDiv.innerHTML = content;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        async function loadHistory() {
            const studentName = document.getElementById('studentName').value.trim();
            
            if (!studentName) {
                alert('Please enter your name to load history.');
                return;
            }

            try {
                const response = await fetch(`/history/${encodeURIComponent(studentName)}`);
                const history = await response.json();
                
                const chatContainer = document.getElementById('chatContainer');
                chatContainer.innerHTML = '<div class="answer"><strong>AI Assistant:</strong> Here is your recent question history:</div>';
                
                if (history.length === 0) {
                    addMessageToChat('answer', '<em>No previous questions found.</em>');
                } else {
                    history.reverse().forEach(item => {
                        addMessageToChat('question', item.question);
                        addMessageToChat('answer', `<strong>AI Assistant:</strong> ${item.answer}`);
                    });
                }
            } catch (error) {
                addMessageToChat('answer', '<strong>Error:</strong> Failed to load history.');
            }
        }
    </script>
</body>
</html>
